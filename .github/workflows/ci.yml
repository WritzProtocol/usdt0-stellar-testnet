name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: forge build
      - name: forge test (unit and Arbitrum Sepolia fork)
        run: forge test -vv
        env:
          ARBITRUM_SEPOLIA_RPC_URL: https://sepolia-rollup.arbitrum.io/rpc

  stellar:
    # build.sh fails unless the rebuilt wasm matches the recorded sha256.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: ./build.sh
        env:
          EXPECTED_OFT_SHA256: d1a0b198cfb4d0ea3d6e7b1efd1add95e4081bffd12f409d00efb380682676eb
          EXPECTED_SAC_MANAGER_SHA256: 061a61793b53662ba9c1a996ed4df69fb9eb9c482aad3744ae30a1b056def72b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stellar-wasm
          path: stellar/out/*.wasm
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node --check oft.mjs
